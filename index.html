<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <title>Quiz Game</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <h1 id="quiz-title">Quiz</h1>

        <div id="quiz-container">

            <div id="progress-container" style="width: 100%; background-color: #e0e0e0; border-radius: 8px; margin-bottom: 10px; height: 20px;">
            <div id="progress-bar" style="width: 0%; height: 100%; background-color: #4caf50; border-radius: 8px;"></div>
            </div>

            <p id="question"></p>
            <div id="answer-box" class="answer-box">
            Drop or type your answer here
            </div>

            <button id="submit-btn">Submit</button>
            <div id="message"></div>
            <div id="answers"></div>
        </div>

        <div id="result-container" style="display: none;">
        <h2>🎉 Geweldig gedaan!</h2>
        <p id="result-time"></p>
        <p id="result-mistakes"></p>
        </div>

        <script src="quiz.js"></script>
    </body>
</html>
