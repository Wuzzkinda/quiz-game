<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1 id="quiz-title">De Reken Challenge</h1>

  <div id="characters-container">


  <div class="character" id="character-left">
    <img id="char-left-img" src="images/characterA/idle.png" alt="Character A">

    <div id="info-container">
      <div id="info-icon">!</div>
      <div id="info-bubble"></div>
    </div>
  </div>


  <div class="character" id="character-right">
    <img id="char-right-img" src="images/characterB/idle.png" alt="Character B">
  </div>

</div>

  <div id="quiz-container">

    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <p id="question"></p>

    <div id="answer-box" class="answer-box">
      Sleep of typ hier je antwoord
    </div>

    <button id="submit-btn">Check</button>

    <div id="message"></div>
    <div id="answers"></div>
  </div>

  <div id="star-bucket-container">
    <div id="star-counter">0</div>
    <div id="star-bucket"></div>
  </div>

  <div id="result-container">
    <h2>🎉 Geweldig gedaan!</h2>
    <p id="result-time"></p>
    <p id="result-mistakes"></p>
    <p id="result-stars"></p>
    <button id="next-level-btn" style="display:none;">
      ➡️ Volgende Deel (Wacht tot iedereen klaar is!)
    </button>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
